# Daily encrypted backup of the Supabase project (Free plan = no automatic backups).
#
# Same dumps as scripts/backup-supabase.mjs (schema, public data, auth, storage metadata),
# packed into one .tar.gz, encrypted with age to a PUBLIC key and uploaded to a private
# Cloudflare R2 bucket. The runner never holds the decryption key: only the age private key
# (kept off GitHub) can open a backup. The repo is public, so nothing unencrypted may be
# uploaded as an artifact or printed to the log.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL       Session pooler connection string (port 5432, IPv4), password URL-encoded
#   BACKUP_AGE_RECIPIENT  age public key (age1...)
#   R2_ACCOUNT_ID         Cloudflare account id
#   R2_ACCESS_KEY_ID      R2 API token with Object Read & Write on the bucket
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET             Bucket name
#
# Retention is handled by an R2 lifecycle rule on the bucket, not here.
# Restore: see docs/backup-restore.md.

name: Supabase backup

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 Argentina
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in SUPABASE_DB_URL BACKUP_AGE_RECIPIENT R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump database
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d-%H-%M-%S)
          dir="$RUNNER_TEMP/backup/$stamp"
          mkdir -p "$dir"
          dump() {
            local file=$1; shift
            supabase db dump --db-url "$SUPABASE_DB_URL" "$@" -f "$dir/$file"
            if [ ! -s "$dir/$file" ]; then echo "::error::$file is empty"; exit 1; fi
            echo "$file: $(du -k "$dir/$file" | cut -f1) KB"
          }
          dump schema.sql  --schema public
          dump data.sql    --data-only --schema public
          dump auth.sql    --data-only --schema auth
          dump storage.sql --data-only --schema storage
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Encrypt
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/backup"
          tar -czf - "$STAMP" | age -r "$BACKUP_AGE_RECIPIENT" -o "$STAMP.tar.gz.age"
          rm -rf "$STAMP"
          echo "Encrypted: $(du -k "$STAMP.tar.gz.age" | cut -f1) KB"

      - name: Upload to R2
        run: |
          set -euo pipefail
          aws s3 cp "$RUNNER_TEMP/backup/$STAMP.tar.gz.age" \
            "s3://$R2_BUCKET/supabase/$STAMP.tar.gz.age" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --only-show-errors
          echo "Uploaded supabase/$STAMP.tar.gz.age"

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"
